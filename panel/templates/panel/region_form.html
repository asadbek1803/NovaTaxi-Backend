{% extends 'panel/base.html' %}

{% block title %}Viloyat tahrirlash - Nova Taxi Admin{% endblock %}
{% block page_title %}Viloyat tahrirlash{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
    <a href="{% url 'panel:regions' %}" class="inline-flex items-center gap-2 text-sm text-gray-500 hover:text-nova-600 mb-4 transition">
        <i class="fa-solid fa-arrow-left"></i> Viloyatlar ro'yxatiga qaytish
    </a>
    <div class="bg-white rounded-2xl border border-gray-200 p-6">
        <div class="flex items-center gap-3 mb-5">
            <div class="w-10 h-10 bg-nova-100 rounded-xl flex items-center justify-center">
                <i class="fa-solid fa-pen text-nova-600"></i>
            </div>
            <h3 class="font-semibold text-gray-800">{{ region.name }}</h3>
        </div>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Viloyat ID</label>
                <input type="text" name="id" value="{{ region.id }}" required
                       class="w-full px-4 py-2.5 bg-gray-100 border border-gray-200 rounded-xl text-sm text-gray-500 cursor-not-allowed" readonly>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Viloyat nomi</label>
                <input type="text" name="name" value="{{ region.name }}" required
                       class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-nova-500 focus:border-nova-500 outline-none transition">
            </div>
            <div class="flex gap-3">
                <a href="{% url 'panel:regions' %}"
                   class="flex-1 px-4 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-xl transition-all text-center">
                    Bekor qilish
                </a>
                <button type="submit"
                        class="flex-1 px-4 py-3 bg-nova-600 hover:bg-nova-700 text-white font-semibold rounded-xl shadow-lg shadow-nova-500/25 transition-all">
                    <i class="fa-solid fa-save"></i> Saqlash
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
